<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" width="1600" height="900">
  <defs>
    <!-- Fondo: nero profondo con una schiaritura appena percettibile -->
    <radialGradient id="bg" cx="46%" cy="40%" r="88%">
      <stop offset="0%"   stop-color="#1B1E20"/>
      <stop offset="50%"  stop-color="#0E1112"/>
      <stop offset="100%" stop-color="#050607"/>
    </radialGradient>

    <linearGradient id="band1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity=".10"/>
      <stop offset="55%"  stop-color="#FFFFFF" stop-opacity=".035"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="band2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity=".07"/>
      <stop offset="70%"  stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity=".38"/>
      <stop offset="45%"  stop-color="#FFFFFF" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Grana: toglie l'aria da gradiente sintetico -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <g filter="url(#soft)">
    <path d="M-120,610 C 240,430 520,760 900,560 C 1180,410 1420,470 1720,300 L1720,980 L-120,980 Z"
          fill="url(#band1)"/>
    <path d="M-120,300 C 280,150 480,380 820,250 C 1120,135 1380,240 1720,110 L1720,-80 L-120,-80 Z"
          fill="url(#band2)"/>
    <path d="M-120,790 C 300,655 700,885 1080,725 C 1340,615 1500,665 1720,605 L1720,1000 L-120,1000 Z"
          fill="#FFFFFF" fill-opacity=".045"/>
  </g>

  <!-- Filo di luce lungo il bordo dell'onda principale -->
  <path d="M-120,610 C 240,430 520,760 900,560 C 1180,410 1420,470 1720,300"
        fill="none" stroke="url(#edge)" stroke-width="1.4"/>
  <path d="M-120,662 C 250,487 530,807 910,607 C 1190,457 1430,517 1720,352"
        fill="none" stroke="url(#edge)" stroke-width="0.8" opacity=".45"/>

  <rect width="1600" height="900" filter="url(#grain)" opacity=".14"/>

  <!-- Velatura in cima, tiene leggibile il menu bianco -->
  <rect width="1600" height="240" fill="#000" opacity=".3"/>
</svg>
