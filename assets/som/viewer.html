<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Roboto+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,300..600&display=swap" rel="stylesheet">
<title>Duetto — SOM viewer</title>
<style>
  /* ── Tokens, matching the site ───────────────────────────────── */
  :root{
    --paper:      #FAFAF8;
    --paper-deep: #F0F1EC;
    --ink:        #16181D;
    --muted:      #5C6672;
    --rule:       #DDE0D9;
    --accent:     #003366;
    --hover:      #D65D0E;

    --display: "Bricolage Grotesque", system-ui, sans-serif;
    --body:    "Source Serif 4", Georgia, serif;
    --mono:    "Roboto Mono", ui-monospace, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ─────────────────────────────────────────────────── */
  header {
    padding: 14px 20px;
    background: var(--paper-deep);
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: baseline;
    gap: 20px;
    flex-shrink: 0;
  }
  header h1 {
    font-family: var(--display); font-weight: 600; font-size: 1.05rem;
    letter-spacing: -0.01em; color: var(--ink);
  }
  header .meta {
    font-family: var(--mono); font-size: 0.72rem;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
  }
  header .meta span { color: var(--ink); margin-left: 4px; }

  /* ── Main layout ─────────────────────────────────────────────── */
  main { display: flex; flex: 1; overflow: hidden; }

  /* Narrow frames: stack the grid above the skeletons rather than
     squeezing both into one row */
  @media (max-width: 860px) {
    main { flex-direction: column; overflow: auto; }
    #right-panel { min-width: 0; max-width: none; border-left: 0; border-top: 1px solid var(--rule); }
    #grid-panel { padding: 10px; }
  }

  /* ── Grid panel ──────────────────────────────────────────────── */
  #grid-panel {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper-deep);
    flex-shrink: 0;
    padding: 16px;
  }
  #grid-wrap { position: relative; cursor: crosshair; }
  #grid-canvas { display: block; image-rendering: pixelated; }

  /* Cell hover highlight drawn on overlay canvas */
  #overlay-canvas { position: absolute; top: 0; left: 0; pointer-events: none; }

  /* ── Right panel ─────────────────────────────────────────────── */
  #right-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--paper-deep);
    border-left: 1px solid var(--rule);
    min-width: 400px;
    max-width: 700px;
    overflow: hidden;
  }

  /* ── Skeleton section ─────────────────────────────────────────── */
  #skeleton-section {
    flex: 1;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    background: var(--paper-deep);
    position: relative;
    min-height: 0;
    gap: 8px;
    padding: 8px;
  }
  .skel-col {
    display: flex; flex-direction: column; align-items: center;
    gap: 4px; flex: 1; min-width: 0;
  }
  /* Same treatment as the small labels across the site */
  .skel-label {
    font-family: var(--mono); font-size: 0.66rem;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted);
  }
  .skel-col canvas { display: block; }

  #skeleton-placeholder {
    color: var(--muted);
    font-family: var(--body); font-size: 0.95rem;
    text-align: center; position: absolute; pointer-events: none;
  }

  /* ── Info section ─────────────────────────────────────────────── */
  #info-section {
    padding: 16px 20px;
    border-top: 1px solid var(--rule);
    flex-shrink: 0;
  }
  #info-section h2 {
    font-family: var(--mono); font-weight: 500; font-size: 0.66rem;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 12px;
  }
  .info-row {
    display: flex; justify-content: space-between;
    padding: 5px 0;
    border-bottom: 1px solid var(--rule);
  }
  .info-row:last-child { border-bottom: 0; }
  .info-row .label {
    font-family: var(--mono); font-size: 0.7rem;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
  }
  .info-row .value {
    font-family: var(--mono); font-size: 0.78rem;
    color: var(--ink); font-variant-numeric: tabular-nums;
  }
  .info-row .value.active   { color: var(--accent); }
  .info-row .value.inactive { color: var(--muted); }

  /* ── Legend ─────────────────────────────────────────────────── */
  #legend {
    padding: 12px 20px;
    border-top: 1px solid var(--rule);
    flex-shrink: 0;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .legend-item {
    display: flex; align-items: center; gap: 7px;
    font-family: var(--mono); font-size: 0.64rem;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
  }
  .legend-swatch { width: 13px; height: 13px; }

  /* ── Loading overlay ─────────────────────────────────────────── */
  #loading {
    position: fixed; inset: 0;
    background: var(--paper);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100; gap: 16px;
    font-family: var(--mono); font-size: 0.72rem;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
  }
  #loading .spinner {
    width: 32px; height: 32px;
    border: 2px solid var(--rule);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){
    #loading .spinner { animation: none; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div id="loading-text">Loading SOM data…</div>
</div>

<header>
  <h1>SOM grid</h1>
  <div class="meta">
    Grid <span id="hdr-grid">—</span> &nbsp;|&nbsp;
    Active <span id="hdr-active">—</span>
  </div>
</header>

<main>
  <!-- Left: SOM grid -->
  <div id="grid-panel">
    <div id="grid-wrap">
      <canvas id="grid-canvas"></canvas>
      <canvas id="overlay-canvas"></canvas>
    </div>
  </div>

  <!-- Right: Skeleton + info -->
  <div id="right-panel">
    <div id="skeleton-section">
      <div class="skel-col">
        <span class="skel-label">Frontal</span>
        <canvas id="skeleton-frontal"></canvas>
      </div>
      <div class="skel-col">
        <span class="skel-label">Lateral</span>
        <canvas id="skeleton-lateral"></canvas>
      </div>
      <div id="skeleton-placeholder">Hover a cell on the grid</div>
    </div>

    <div id="info-section">
      <h2>Cell info</h2>
      <div class="info-row"><span class="label">Token ID</span><span class="value" id="info-id">—</span></div>
      <div class="info-row"><span class="label">Row / Col</span><span class="value" id="info-rowcol">—</span></div>
      <div class="info-row"><span class="label">Status</span><span class="value" id="info-status">—</span></div>
    </div>

    <div id="legend">
      <div class="legend-item">
        <div class="legend-swatch" style="background:#E8E9E4;border:1px solid var(--rule);"></div>
        Inactive
      </div>
      <div class="legend-item">
        <div class="legend-swatch" style="background:linear-gradient(90deg,rgb(250,250,248),rgb(150,190,195),rgb(15,95,92),rgb(0,51,102),rgb(16,20,34));border:1px solid var(--rule);width:40px;"></div>
        U-matrix: interior → boundary
      </div>
      <div class="legend-item">
        <div class="legend-swatch" style="background:var(--hover);"></div>
        Hovered
      </div>
    </div>
  </div>
</main>

<script>
'use strict';

// ── sVision 20-joint connections ─────────────────────────────────────
const CONNECTIONS = [
  [0,1],[0,14],[0,15],[14,16],[15,17],[0,18],
  [1,2],[1,5],[2,5],[1,19],[19,8],[19,11],[8,11],
  [2,3],[3,4],[5,6],[6,7],
  [8,9],[9,10],[11,12],[12,13],
];

// ── State ─────────────────────────────────────────────────────────────
let SOM = null;            // loaded data
let CELL_PX = 5;           // pixels per SOM cell
let hoveredCell = -1;

// Global skeleton bounds — computed once from all active poses.
// Fixed scale ensures every skeleton has the same proportions regardless of cell.
let SKEL_Y_MIN = -2.0;
let SKEL_Y_MAX =  1.0;
let SKEL_H_RANGE = 2.0;   // max horizontal span (Z for frontal, X for lateral)

// ── Load data ─────────────────────────────────────────────────────────
async function loadData() {
  const resp = await fetch('som_data.json');
  if (!resp.ok) throw new Error(`HTTP ${resp.status} — could not load som_data.json`);
  return resp.json();
}

// ── Compute global skeleton bounds for consistent scale ───────────────
function precomputeColors(som) {
  const { K_max, active_mask, poses } = som;

  let yMin = Infinity, yMax = -Infinity;
  let zMin = Infinity, zMax = -Infinity;
  let xMin = Infinity, xMax = -Infinity;

  for (let i = 0; i < K_max; i++) {
    if (!active_mask[i] || !poses[i]) continue;
    const p = poses[i];
    for (let j = 0; j < 20; j++) {
      const x = p[j*3], y = p[j*3+1], z = p[j*3+2];
      if (y < yMin) yMin = y;
      if (y > yMax) yMax = y;
      if (z < zMin) zMin = z;
      if (z > zMax) zMax = z;
      if (x < xMin) xMin = x;
      if (x > xMax) xMax = x;
    }
  }

  const yPad = (yMax - yMin) * 0.05;
  SKEL_Y_MIN = yMin - yPad;
  SKEL_Y_MAX = yMax + yPad;

  // Horizontal range: max of frontal (Z) and lateral (X) spans + 5% margin
  const rawH = Math.max(zMax - zMin, xMax - xMin);
  SKEL_H_RANGE = rawH * 1.10;
}

// ── U-matrix cell color ───────────────────────────────────────────────
// t in [0,1]: 0 = cluster interior (dark navy), 1 = cluster boundary.
// Gamma < 1 expands the low-to-mid range so cluster structure is visible
// even when a few outlier cells (noisy skeletons) would otherwise push
// most values into the dark end of a linear scale.
// The U-matrix values sit in a narrow band — on this tokenizer roughly
// 0.03 to 0.19 — so a fixed scale wastes most of the colour range and the
// structure washes out. Instead the 2nd and 98th percentiles of the actual
// data are stretched across the whole ramp, which is computed once at load.
let UMIN = 0, UMAX = 1;

function computeUmatrixRange(som) {
  const vals = [];
  for (let i = 0; i < som.K_max; i++) {
    if (som.active_mask[i]) vals.push(som.umatrix[i]);
  }
  vals.sort((a, b) => a - b);
  UMIN = vals[Math.floor(vals.length * 0.001)];
  UMAX = vals[Math.floor(vals.length * 0.99)];
  if (UMAX <= UMIN) { UMIN = 0; UMAX = 1; }
}

// Multi-stop ramp: page colour → pale blue → teal → navy → ink. More stops
// than a straight two-colour fade, so neighbouring values stay apart.
const UMATRIX_STOPS = [
  [250,250,248],
  [150,190,195],
  [ 15, 95, 92],
  [  0, 51,102],
  [ 16, 20, 34],
];



function umatrixColor(v) {
  let t = (v - UMIN) / (UMAX - UMIN);
  t = Math.max(0, Math.min(1, t));
  const k = UMATRIX_STOPS.length - 1;
  const seg = Math.min(Math.floor(t * k), k - 1);
  const f = t * k - seg;
  const a = UMATRIX_STOPS[seg], b = UMATRIX_STOPS[seg + 1];
  const r = Math.round(a[0] + (b[0] - a[0]) * f);
  const g = Math.round(a[1] + (b[1] - a[1]) * f);
  const bl = Math.round(a[2] + (b[2] - a[2]) * f);
  return `rgb(${r},${g},${bl})`;
}

// ── Draw the full grid ────────────────────────────────────────────────
function drawGrid(som, canvas) {
  const { cols, K_max, umatrix, active_mask } = som;
  const ctx = canvas.getContext('2d');

  for (let i = 0; i < K_max; i++) {
    const r = Math.floor(i / cols);
    const c = i % cols;
    ctx.fillStyle = active_mask[i] ? umatrixColor(umatrix[i]) : '#E8E9E4';
    ctx.fillRect(c * CELL_PX, r * CELL_PX, CELL_PX, CELL_PX);
  }
}

// ── Draw hover highlight on overlay canvas ────────────────────────────
function drawOverlay(som, overlayCanvas, cellIdx) {
  const { cols } = som;
  const ctx = overlayCanvas.getContext('2d');
  ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
  if (cellIdx < 0) return;

  const r = Math.floor(cellIdx / cols);
  const c = cellIdx % cols;
  const x = c * CELL_PX, y = r * CELL_PX;

  // Outer glow
  ctx.save();
  ctx.strokeStyle = 'rgba(214,93,14,0.95)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(x + 0.5, y + 0.5, CELL_PX - 1, CELL_PX - 1);
  ctx.restore();
}

// ── Draw skeleton ─────────────────────────────────────────────────────
// viewMode: 'frontal' (Z-Y, inverted Z) or 'lateral' (X-Y)
function drawSkeleton(pose60, canvas, isActive, viewMode) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  if (!pose60) {
    ctx.strokeStyle = '#DDE0D9';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(W*0.3, H*0.3); ctx.lineTo(W*0.7, H*0.7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W*0.7, H*0.3); ctx.lineTo(W*0.3, H*0.7); ctx.stroke();
    return;
  }

  // Parse joints: 20 × 3
  const joints = [];
  for (let j = 0; j < 20; j++) {
    joints.push({ x: pose60[j*3], y: pose60[j*3+1], z: pose60[j*3+2] });
  }

  // ── Axis selection ────────────────────────────────────────────────
  // FRONTAL (Z-Y): after per-frame yaw correction the shoulder span lies
  //   along Z, so Z-Y gives the familiar front-on view.
  // LATERAL (X-Y): X is the person's depth axis (forward/backward).
  // Both views share the same FIXED vertical scale derived from the global
  // Y bounds of all active poses, so skeleton height never changes between
  // cells or between the two views.
  const isFrontal = (viewMode !== 'lateral');

  // Fixed scale — same for every pose and every view.
  // Constrained by both height (so skeletons don't overflow vertically) and
  // width (so wide arm-extended poses don't clip the canvas horizontally).
  const pad    = 16;
  const drawH  = H - pad * 2;
  const drawW  = W - pad * 2;
  const yRange = Math.max(SKEL_Y_MAX - SKEL_Y_MIN, 0.1);
  const scale  = Math.min(drawH / yRange, drawW / Math.max(SKEL_H_RANGE, 0.1));

  // Horizontal: centre this pose's own span at the canvas midpoint.
  // (We don't use a global horizontal range because frontal and lateral
  // naturally have different widths, and per-pose centering keeps the
  // skeleton always visible without jumping around.)
  let hMin = Infinity, hMax = -Infinity;
  for (const jt of joints) {
    const h = isFrontal ? jt.z : jt.x;
    if (h < hMin) hMin = h;
    if (h > hMax) hMax = h;
  }
  const hCenter = (hMin + hMax) / 2;   // pose's own horizontal midpoint
  const cx = W / 2;

  // Project: invert horizontal so body-left → screen-left; fixed Y origin
  function project(jt) {
    const h = isFrontal ? jt.z : jt.x;
    return {
      px: cx - (h - hCenter) * scale,
      py: pad + (jt.y - SKEL_Y_MIN) * scale,
    };
  }

  const p2d = joints.map(project);

  // ── Draw bones ────────────────────────────────────────────────────
  ctx.lineWidth = 2.5;
  ctx.lineCap   = 'round';
  for (const [a, b] of CONNECTIONS) {
    const pa = p2d[a], pb = p2d[b];
    const grad = ctx.createLinearGradient(pa.px, pa.py, pb.px, pb.py);
    grad.addColorStop(0, isActive ? '#003366' : '#B8BCB4');
    grad.addColorStop(1, isActive ? '#0F5F5C' : '#C4C9CC');
    ctx.strokeStyle = grad;
    ctx.beginPath();
    ctx.moveTo(pa.px, pa.py);
    ctx.lineTo(pb.px, pb.py);
    ctx.stroke();
  }

  // ── Draw joints ───────────────────────────────────────────────────
  for (let j = 0; j < p2d.length; j++) {
    const { px, py } = p2d[j];
    const isHead = j === 0 || j === 14 || j === 15 || j === 16 || j === 17 || j === 18;
    ctx.beginPath();
    ctx.arc(px, py, isHead ? 3 : 4, 0, Math.PI * 2);
    ctx.fillStyle = isActive ? '#16181D' : '#B8BCB4';
    ctx.fill();
  }
}

// ── Update info panel ─────────────────────────────────────────────────
function updateInfo(som, cellIdx) {
  const elId     = document.getElementById('info-id');
  const elRC     = document.getElementById('info-rowcol');
  const elStatus = document.getElementById('info-status');

  if (cellIdx < 0) {
    elId.textContent     = '—';
    elRC.textContent     = '—';
    elStatus.textContent = '—';
    elStatus.className   = 'value';
    return;
  }

  const { cols, active_mask } = som;
  const r = Math.floor(cellIdx / cols);
  const c = cellIdx % cols;
  const isActive = !!active_mask[cellIdx];

  elId.textContent     = cellIdx;
  elRC.textContent     = `${r}  /  ${c}`;
  elStatus.textContent = isActive ? 'Active' : 'Inactive';
  elStatus.className   = 'value ' + (isActive ? 'active' : 'inactive');
}

// ── Mouse handling ────────────────────────────────────────────────────
function cellFromMouse(e, gridWrap, som) {
  const rect = gridWrap.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const c = Math.floor(mx / CELL_PX);
  const r = Math.floor(my / CELL_PX);
  if (c < 0 || c >= som.cols || r < 0 || r >= som.rows) return -1;
  return r * som.cols + c;
}

// ── Main ──────────────────────────────────────────────────────────────
(async () => {
  const loadingEl   = document.getElementById('loading');
  const loadingText = document.getElementById('loading-text');

  try {
    // ── Load data ─────────────────────────────────────────────────
    const som = await loadData();
    SOM = som;

    // ── Compute cell pixel size to fit the viewport ────────────────
    const maxGridW = window.innerWidth * 0.60;
    const maxGridH = window.innerHeight - 60;     // subtract header
    CELL_PX = Math.max(2, Math.min(
      Math.floor(maxGridW / som.cols),
      Math.floor(maxGridH / som.rows),
    ));

    const gridW = som.cols * CELL_PX;
    const gridH = som.rows * CELL_PX;

    // ── Setup canvases ────────────────────────────────────────────
    const gridCanvas     = document.getElementById('grid-canvas');
    const overlayCanvas  = document.getElementById('overlay-canvas');
    const skelFrontal    = document.getElementById('skeleton-frontal');
    const skelLateral    = document.getElementById('skeleton-lateral');
    const gridWrap       = document.getElementById('grid-wrap');

    gridCanvas.width  = overlayCanvas.width  = gridW;
    gridCanvas.height = overlayCanvas.height = gridH;

    // Skeleton canvases: safe defaults; resizeSkel() will correct them
    const skelSection = document.getElementById('skeleton-section');
    skelFrontal.width  = skelLateral.width  = 140;
    skelFrontal.height = skelLateral.height = 320;

    // ── Fill header ───────────────────────────────────────────────
    document.getElementById('hdr-grid').textContent =
      `${som.rows} × ${som.cols}`;
    document.getElementById('hdr-active').textContent =
      `${som.K_active} / ${som.K_max}  (${(100*som.K_active/som.K_max).toFixed(1)}%)`;

    // ── Precompute colors ─────────────────────────────────────────
    loadingText.textContent = 'Computing colours…';
    // defer to next frame so the text renders
    await new Promise(r => setTimeout(r, 0));
    precomputeColors(som);
    computeUmatrixRange(som);

    // ── Draw grid ─────────────────────────────────────────────────
    loadingText.textContent = 'Rendering grid…';
    await new Promise(r => setTimeout(r, 0));
    drawGrid(som, gridCanvas);

    // ── Hide loading ──────────────────────────────────────────────
    loadingEl.style.display = 'none';

    // ── Mouse interaction ─────────────────────────────────────────
    function refreshSkeletons(idx) {
      const placeholder = document.getElementById('skeleton-placeholder');
      if (idx < 0) {
        placeholder.style.display = 'block';
        return;
      }
      placeholder.style.display = 'none';
      const pose     = som.poses[idx];
      const isActive = !!som.active_mask[idx];
      drawSkeleton(pose, skelFrontal, isActive, 'frontal');
      drawSkeleton(pose, skelLateral, isActive, 'lateral');
    }

    gridWrap.addEventListener('mousemove', (e) => {
      const idx = cellFromMouse(e, gridWrap, som);
      if (idx === hoveredCell) return;
      hoveredCell = idx;
      drawOverlay(som, overlayCanvas, idx);
      updateInfo(som, idx);
      refreshSkeletons(idx);
    });

    gridWrap.addEventListener('mouseleave', () => {
      hoveredCell = -1;
      drawOverlay(som, overlayCanvas, -1);
      updateInfo(som, -1);
      document.getElementById('skeleton-placeholder').style.display = 'block';
    });

    // ── Resize skeleton canvases to fill the section ──────────────
    const resizeSkel = () => {
      const rect = skelSection.getBoundingClientRect();
      const cols = 2;
      const colW = Math.floor((rect.width  - 24 - 8) / cols);  // 8px gap
      const h    = Math.max(80, rect.height - 32);
      if (colW > 40) {
        skelFrontal.width  = skelLateral.width  = colW;
        skelFrontal.height = skelLateral.height = h;
        if (hoveredCell >= 0) refreshSkeletons(hoveredCell);
      }
    };
    window.addEventListener('resize', resizeSkel);
    resizeSkel();

  } catch (err) {
    loadingText.textContent = `Error: ${err.message}`;
    console.error(err);
  }
})();
</script>
</body>
</html>
