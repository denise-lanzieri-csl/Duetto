<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" role="img" aria-label="Tokens produced one after another, each conditioned on the last" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
    <!-- the sequence so far -->
    <g opacity=".45">
      <rect x="12" y="38" width="13" height="13" rx="1"/>
      <rect x="30" y="38" width="13" height="13" rx="1"/>
      <rect x="48" y="38" width="13" height="13" rx="1"/>
    </g>
    <!-- the token being produced -->
    <rect x="66" y="38" width="13" height="13" rx="1"/>
    <!-- what comes next, still open -->
    <rect x="84" y="38" width="13" height="13" rx="1" stroke-dasharray="2 3" opacity=".45"/>
    <rect x="102" y="38" width="13" height="13" rx="1" stroke-dasharray="2 3" opacity=".22"/>
    <!-- each one looks back at those before it -->
    <path d="M72 36 C68 24, 54 24, 50 36" opacity=".55"/>
    <path d="M72 36 C66 18, 42 18, 36 36" opacity=".38"/>
    <path d="M72 36 C64 12, 26 12, 18 36" opacity=".22"/>
    <!-- arrow of time -->
    <path d="M12 62 H108 M103 58 l5 4 l-5 4" opacity=".4"/>
  </g>
</svg>
