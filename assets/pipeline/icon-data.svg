<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" role="img" aria-label="A camera on a tripod recording a dancer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">

    <!-- camera body, lens cone, tripod -->
    <rect x="7" y="27" width="25" height="18" rx="3.5"/>
    <path d="M32 31 L41 26 V46 L32 41 Z"/>
    <path d="M41 32 l4.5 -1.5 M41 40 l4.5 1.5"/>
    <path d="M19.5 45 V60 M19.5 60 L12 77 M19.5 60 L27 77 M19.5 60 V77"/>

    <!-- field of view, opening toward the dancer -->
    <path d="M47 30 L84 17" stroke-dasharray="4 4.5" stroke-width="2.4"/>
    <path d="M47 42 L86 70" stroke-dasharray="4 4.5" stroke-width="2.4"/>

    <!-- the dancer: curved limbs, a body in motion rather than a stick man -->
    <circle cx="99" cy="25" r="7"/>
    <path d="M99 32 C97 41, 98 50, 96 58"/>
    <!-- raised arm, arcing clear of the head -->
    <path d="M94 35 C88 30, 87 20, 93 15"/>
    <!-- extended arm -->
    <path d="M101 37 C107 39, 112 40, 117 37"/>
    <!-- legs: one planted, one trailing -->
    <path d="M96 58 C94 66, 93 74, 92 82"/>
    <path d="M96 58 C102 64, 108 69, 114 71"/>
  </g>
</svg>
