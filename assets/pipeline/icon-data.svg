<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" role="img" aria-label="A camera recording a dancer in arabesque" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 72 H112" opacity=".35"/>

    <!-- camera on a tripod -->
    <rect x="12" y="28" width="17" height="11" rx="1"/>
    <path d="M29 31 l7-3 v11 l-7-3z"/>
    <path d="M20 39 v9 M20 48 l-7 16 M20 48 l7 16" opacity=".85"/>

    <!-- the dancer, in arabesque: standing on one leg, torso tipped forward,
         the other leg lifted behind, one arm reaching toward the camera and
         one trailing back -->
    <g>
      <circle cx="76.4" cy="28.7" r="4.5"/>
      <!-- torso -->
      <path d="M77.9 32.9 L83 47"/>
      <!-- arms -->
      <path d="M79.1 36.2 L66.5 39.5 M79.1 36.2 L90 35"/>
      <!-- standing leg, and the lifted leg behind -->
      <path d="M83 47 L82 64 M83 47 L99 40.5"/>
    </g>

    <!-- one ray from the lens to the dancer -->
    <path d="M38 34 L58 36" stroke-dasharray="2 4" opacity=".45"/>
  </g>
</svg>
