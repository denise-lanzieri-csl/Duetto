<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" role="img" aria-label="A map of cells, where neighbouring cells hold similar postures and a distant cell holds a very different one" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">

    <!-- the map -->
    <g opacity=".3">
      <path d="M20 14 H100 M20 36 H100 M20 58 H100 M20 80 H100"/>
      <path d="M20 14 V80 M40 14 V80 M60 14 V80 M80 14 V80 M100 14 V80"/>
    </g>
    <rect x="40" y="36" width="20" height="22" fill="currentColor" opacity=".09" stroke="none"/>
    <rect x="60" y="36" width="20" height="22" fill="currentColor" opacity=".15" stroke="none"/>

    <!-- two neighbouring cells: the same kind of posture (one arm raised, one
         lowered, feet apart) but not the same posture -->
    <g stroke-width="1.2">
      <!-- left cell -->
      <circle cx="50" cy="40.5" r="2.4"/>
      <path d="M50 43 V50.5"/>
      <path d="M50 44.5 L44.5 48.5 M50 44.5 L55.5 39.5"/>
      <path d="M50 50.5 L46.5 56.5 M50 50.5 L53.5 56"/>

      <!-- right cell: body leaning a little, raised arm lower, feet wider -->
      <circle cx="70.6" cy="40.8" r="2.4"/>
      <path d="M70.6 43.2 L70 50.5"/>
      <path d="M70.5 44.6 L64.5 46.5 M70.5 44.6 L76.5 42.8"/>
      <path d="M70 50.5 L65.5 56.5 M70 50.5 L75 55"/>
    </g>

    <!-- the distant cell: nothing like its neighbours — a skeleton caught
         mid-pirouette. Supporting leg straight, the other folded at the
         knee, arms rounded, joints marked. -->
    <g stroke-width="1.2" opacity=".6">
      <circle cx="30" cy="61.6" r="2"/>
      <path d="M30 63.6 V70.5"/>
      <path d="M30 65 C26.2 66 26.2 69.6 29 70.2 M30 65 C33.8 66 33.8 69.6 31 70.2"/>
      <path d="M30 70.5 V78.4"/>
      <path d="M30 70.5 L35.4 73.6 L30.4 75.6"/>
      <g fill="currentColor" stroke="none">
        <circle cx="30" cy="65" r=".9"/><circle cx="30" cy="70.5" r=".9"/>
        <circle cx="35.4" cy="73.6" r=".9"/><circle cx="30.4" cy="75.6" r=".9"/>
        <circle cx="30" cy="78.4" r=".9"/>
      </g>
    </g>

    <!-- a path walked across the map -->
    <path d="M50 46 C58 44, 62 46, 70 46" stroke-dasharray="2 3" opacity=".65"/>
  </g>
</svg>
