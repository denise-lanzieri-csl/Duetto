<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" role="img" aria-label="A map of cells, where neighbouring cells hold similar postures" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
    <g opacity=".3">
      <path d="M20 14 H100 M20 36 H100 M20 58 H100 M20 80 H100"/>
      <path d="M20 14 V80 M40 14 V80 M60 14 V80 M80 14 V80 M100 14 V80"/>
    </g>
    <rect x="40" y="36" width="20" height="22" fill="currentColor" opacity=".09" stroke="none"/>
    <rect x="60" y="36" width="20" height="22" fill="currentColor" opacity=".15" stroke="none"/>
    <!-- two neighbouring cells, two near-identical postures -->
    <g stroke-width="1.2">
      <circle cx="50" cy="42" r="2.4"/>
      <path d="M50 44.5 V52 M44 47 H56 M50 52 L45 56 M50 52 L55 56"/>
      <circle cx="70" cy="42" r="2.4"/>
      <path d="M70 44.5 V52 M64 48 H76 M70 52 L65 56 M70 52 L76 55"/>
    </g>
    <!-- and one further away, visibly different -->
    <g stroke-width="1.2" opacity=".55">
      <circle cx="30" cy="68" r="2.4"/>
      <path d="M30 70.5 V76 M24 68 L30 72 L37 66 M30 76 L25 79 M30 76 L36 78"/>
    </g>
    <!-- a path walked across the map -->
    <path d="M50 46 C58 44, 62 46, 70 46" stroke-dasharray="2 3" opacity=".65"/>
  </g>
</svg>
