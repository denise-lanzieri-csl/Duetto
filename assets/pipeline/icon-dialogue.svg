<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" role="img" aria-label="Two bodies at a distance, each answering the other" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
    <!-- the performer, solid -->
    <g>
      <circle cx="34" cy="26" r="4.5"/>
      <path d="M34 30.5 V48 M34 35 l-9 7 M34 35 l9 4 M34 48 l-6 16 M34 48 l7 16"/>
    </g>
    <!-- the machine, dashed, in a different pose -->
    <g stroke-dasharray="2.5 3" opacity=".75">
      <circle cx="86" cy="30" r="4.5"/>
      <path d="M86 34.5 V52 M86 38 l9 -5 M86 38 l-8 7 M86 52 l6 14 M86 52 l-7 15"/>
    </g>
    <!-- the gap between them, which is the working space -->
    <path d="M44 40 H76" stroke-dasharray="1 4" opacity=".5"/>
    <path d="M50 34 C58 28, 64 28, 72 33" opacity=".55"/>
    <path d="M72 48 C64 54, 58 54, 50 49" opacity=".55"/>
    <path d="M69 31 l4 2 l-4 2" opacity=".55"/>
    <path d="M53 47 l-4 2 l4 2" opacity=".55"/>
  </g>
</svg>
