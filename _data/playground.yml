# ============================================================
# PLAYGROUND — one entry per creativity level, in order.
#
# The slider maps straight onto this list: first entry is the
# leftmost position, last entry the rightmost. Add or remove
# entries and the slider adjusts itself.
#
# `video`   file in assets/playground/ (mp4, muted, looping)
# `poster`  optional still, shown before the video loads
# `label`   short name under the slider
# `caption` one or two lines describing what happens at this level
# ============================================================


- label: Delay
  video: delay.mp4
  poster: creativity-0.jpg
  caption: >-
    The system reproduces the performer’s movement after a delay.
    The response follows the dancer, but does not yet introduce variation.


- label: Low
  video: low.mp4
  poster: creativity-0.jpg
  caption: >-
    Small deviations begin to appear. The generated movement stays close
    to the performer’s, but no longer matches every posture.

- label: Moderate
  video: medium.mp4
  caption: >-
    The system begins to propose transitions the performer did not make,
    introducing new movement possibilities while preserving a recognisable flow.
    

- label: High
  video: high.mp4
  caption: >-
    The connection between the two bodies becomes loose, and the generated
    movement increasingly follows its own trajectory. Without enough influence
    from the performer, coherence can break down and the dialogue can dissolve.

  