- id: why-movement
  tag: Foundations
  title: Why movement
  image: grid_animation.webp
  image_alt: Uno scheletro tracciato in movimento su una griglia
  summary: >-
    Human movement is measurable, yet governed by fewer rigid rules than language,
    making it a compelling domain for studying creativity in AI.
  body: |
    Building a system designed for genuine exploration means the choice of
    domain is not neutral. We study human movement as a complex dynamical system:
    something we can observe, measure, and describe through quantitative and
    qualitative metrics. But movement has a distinctive quality that makes it particularly interesting for AI research:
    it is structured, yet open to possibility. 

    Consider language. Words can be combined in countless ways, but their order is constrained by grammar and meaning.
    Change that order too much, and a sentence may become difficult to understand or lose its meaning.

    Movement works differently. The body obeys physical laws, and movements have their own forms of coherence,
    shaped by context and intention. Yet within these constraints, there is far greater freedom to vary,
    invent, and explore. In dance, there is rarely just one correct way to move.

    This balance between structure and freedom makes human movement a particularly rich domain for generative AI:
    a system must learn not only how movement is organised, but also where its possibilities begin.
  blocks:
    - heading: A spectrum of semantic constraint
      body: |
        Not all movement follows the same rules. In dance, a movement
        can be unexpected, unconventional, or entirely new and still be
        meaningful.
        In surgery or athletic performance, deviations from established
        patterns may have functional or safety consequences.

        These domains lie at different points along a spectrum of constraints,
        from open-ended creative exploration to precise, goal-oriented execution.
        The challenge for a generative model is not simply to learn how movement
        unfolds, but to understand which constraints matter in a given context
        and how much freedom remains within them.

        The same underlying principles can support both ends of this spectrum.
        What changes is how the model balances exploration and precision,
        adapting its generation to the purpose of the movement.

- id: large-movement-model
  side: left
  tag: Model
  title: The Large Movement Model
  image: D1_M17_T1_Frontal_trajectory.svg
  image_alt: Uno scheletro tracciato in movimento su una griglia
  summary: >-
    Joints define the body's structure; movement sequences unfold like sentences.
    A model learns the patterns that organise how bodies move through space and time.
  body: |
    What made large language models possible was not scale alone, but the
    recognition that language has an underlying structure.
    By learning its statistical regularities, a model can generate sequences
    that are coherent, context-sensitive, and sometimes creative. 

    Movement offers a parallel opportunity. A Large Movement Model applies this
    generative perspective to the dynamics of the human body. Rather than modelling
    isolated poses, it learns the temporal relationships between body configurations:
    how movements unfold, how one state leads to another, and how local actions
    combine into longer sequences. <br>
    The goal is to learn the underlying regularities of bodily motion well enough
    to generate new trajectories, conditioned by context and responsive to the
    movement unfolding in real time.

- id: duetto
  tag: Application
  title: Duetto
  image: dance1.jpg
  image_alt: Una danzatrice in scena accanto alla proiezione del suo scheletro digitale
  credit: CCN/Aterballetto al Festival Aperto con Microdanze e Over Dance
  summary: >-
    Duetto is a real-time generative system that follows a dancer's movement,
    learns from it, and responds with alternative movement trajectories.
  body: |
    Duetto is the first application and proof of concept of the Large
    Movement Model, built around two questions: how technology can enrich
    dancers' creative practices, and whether deep learning can power a
    movement suggestion system for dancers.

    The central challenge is to build a generative system that can interact
    continuously with a human performer in real time, without introducing
    the delays that disrupt creative flow. The system must do more than track
    or reproduce movement: it must generate new possibilities in response to
    the performer's actions, while remaining responsive enough to sustain
    an ongoing exchange.

    The interaction is bidirectional. The dancer moves, the system responds,
    and each response creates new possibilities for the dancer. What emerges
    is not simply imitation, but a dialogue between human movement and
    machine-generated motion.
  blocks:
    - heading: Why dance
      body: |
        We chose dance because it offers an exceptionally demanding test of
        movement generation. Its expressive freedom, temporal complexity, and
        openness to novelty leave little room for predefined notions of correctness.

        A system that can sustain a meaningful exchange with a dancer must do more
        than reproduce familiar patterns: it must respond to an individual, adapt
        to changing conditions, and generate possibilities without imposing a
        fixed solution.

        Dance therefore provides a demanding environment in which to investigate
        principles that may extend to other movement domains, from sport and
        rehabilitation to procedural and interactive tasks.

- id: how-it-works
  tag: Method
  title: How it works
  layout: centered
  collapsible: true
  summary: >-
    From video to discrete movement representations to real-time generation:
    the pipeline that enables an ongoing dialogue between dancer and machine.
  body: |
    The pipeline begins with video input, from which the system estimates the
    body's motion as a sequence of spatial coordinates. These trajectories
    are transformed into a structured, discrete representation that a
    generative model can learn and manipulate.

    The model then predicts new movement sequences, conditioned on previous
    states and, in the interactive setting, on the performer's ongoing movement.

    Each stage addresses a different challenge: extracting meaningful motion
    from visual data, organising movement into a learnable representation, and
    generating new trajectories fast enough to sustain real-time interaction.

  blocks:
    - heading: Data collection
      id: data-collection
      image: DSC00383.JPG
      image_alt: Uno scheletro tracciato in movimento su una griglia
      body: |
        In the first session, we recruited dancers across three experience
        levels: professional, semi-professional, and non-professional, and
        recorded their movement under nine musical conditions varying in
        intensity, style, and tempo. The aim was to capture a diverse range
        of movement patterns and expressive responses.

        In the second session, sixteen professional dancers each performed
        four improvised pieces under choreographic guidance. In two of the
        four trials, dancers performed while viewing a skeletonised projection
        of their own bodies. This feedback condition allowed us to investigate
        how visual representations of movements could shape the performer’s
        experience and informed the design of the interactive system.

    - heading: From video to movement
      id: pose-estimation
      video: D1_M9_T2_svision.mp4
      video_on_white: true
      video_alt: How sVision tracks a moving body
      body: |
        The first step is to extract movement information from video.
        Using real-time human pose estimation, the system identifies
        key body landmarks and tracks their positions over time, turning
        the moving body into a sequence of spatial coordinates.

        This representation makes movement measurable and provides the
        foundation for the next stages: learning its patterns, modelling
        its dynamics, and generating new movement in response to the performer.

    - heading: Quantising the body
      id: quantising-the-body
      video: video_som.mp4
      video_alt: Quantising the body
      body: |
        Raw joint coordinates must be transformed into a discrete vocabulary
        that a generative model can process. The choice of quantisation method
        matters: it determines not only how movement is compressed, but also
        which relationships between poses remain accessible to the model.

        Vector-quantised variational autoencoders (VQ-VAEs) provide a useful
        baseline for learning discrete representations of continuous movement.
        Building on this approach, we developed SOM-VQ, which combines vector
        quantisation with Self-Organising Maps to organise the codebook into
        an explicit spatial structure.

        In this representation, neighbouring regions of the map are intended
        to capture related movement patterns, making the latent space easier
        to navigate and interpret. Rather than treating the codebook as an
        opaque collection of discrete tokens, we use its organisation as a
        basis for interactive control.

        A dancer can guide generation by moving through this space: exploring nearby 
        configurations, departing from a reference pose, or steering the system back 
        towards a target region. Control is therefore not simply added on top of the 
        generative model; it emerges from the structure of the representation itself.

    - heading: The generative model
      id: generative-model
      body: |
        At the core of the system is an autoregressive model that generates
        movement one token at a time. Each prediction is conditioned on the
        preceding sequence and, in the interactive setting, on the performer's
        live input.

        The challenge is not generation alone, but generation under real-time
        constraints. New movement must be produced continuously, with sufficiently
        low latency to sustain an uninterrupted exchange between performer and system.
        This requires the generative model and the surrounding pipeline to operate as
        a single responsive system, rather than relying on the replay of precomputed
        sequences.

    - heading: Divergence as dialogue
      id: smart-mirror
      images:
        - image: som1.png
          alt: Superficie di attivazione della SOM con la zona di campionamento
          caption: SOM activation surface. Brightness indicates proximity to the performer's current pose.
        - image: som2.png
          alt: Probabilità di campionamento del transformer nella stessa zona
          caption: Transformer next-token probabilities, restricted to the same region of the map.
      body: |
        The difference between the performer's current movement and the machine's
        generated trajectory is not necessarily an error. It can become the creative
        distance through which the interaction unfolds.

        By constraining generation through the topology of the map, the system
        can explore alternatives in the neighbourhood of the performer's current
        state while remaining responsive to the human input. The map provides a
        structured space in which the system can depart from the dancer's movement
        without losing its connection to it.

        The result is a form of interaction in which divergence is neither eliminated
        nor left entirely unconstrained: it becomes a navigable dimension of the dialogue
        between human and machine.

- id: staying-open
  tag: Theory
  title: Staying open
  side: left
  image: recursion.jpeg
  image_alt: Recursion
  summary: >-
    How can an AI system learn from experience without losing its capacity to explore?
    Our theoretical research investigates how generative models can preserve diversity
    and balance structure with creativity.
  body: |
    Generative models learn patterns from data and use them to create new examples.
    But what happens when a model repeatedly learns from its own outputs?
    Over time, it can lose diversity and become increasingly limited in what
    it can generate. This phenomenon is known as model collapse.

    Our theoretical research investigates two related challenges: how diversity
    can be lost during repeated learning, and how to understand the boundary
    between structured behaviour and increasingly unstable dynamics.

    These questions matter for generative systems designed to interact with people.
    A model should learn from experience and adapt to an individual without becoming
    trapped in the patterns it has already seen. It needs structure, but also room
    to explore.
  blocks:
    - heading: Learning to explore
      body: |
        Learning is not just about reproducing patterns in existing data. It is also
        about preparing for what has not yet been seen.
        In one study, we investigate how synthetic data can help learning
        systems explore new regions of the data space, preparing them to respond
        when the statistical properties of the data change. Rather than treating
        generated data simply as a substitute for real observations, this approach
        uses exploration to expand what a model can learn from.

        A complementary perspective comes from a second study, which investigates 
        how the dynamics of neural networks can be shaped
        during training. By controlling Lyapunov exponents, the method aims to
        improve the network’s ability to adapt to changes in the data. <br>
        Together, these studies address a fundamental question: how can learning
        systems remain adaptable when the world does not behave exactly as expected? 


        Read the paper: <br>
        [Dreaming Learning](https://arxiv.org/abs/2410.18156)<br>
        [Read the paper: Lyapunov Learning at the Onset of Chaos](https://arxiv.org/abs/2506.12810)

    - heading: Why this matters for a dancer
      body: |
        A system that learns from one person’s movement should become increasingly
        responsive to that person without simply repeating what it has already
        seen. <br>
        The challenge is to learn an individual’s movement patterns while leaving
        room for surprise. A generative system should be able to recognise familiar
        movements, respond to the performer’s choices, and still propose new
        possibilities.

        This is where the broader questions explored in our theoretical research
        become relevant to movement generation: how can a model learn from
        experience without becoming confined by it?

        The ambition is to build a system that understands a body well enough to
        interact with it meaningfully, while continuing to open up new directions
        for movement.

- id: beyond-the-stage
  tag: Outlook
  title: Beyond the stage
  gallery:
    - image: sport.png
      alt: Un tennista a metà servizio
    - image: cuisine.png
      alt: Mani che emulsionano una salsa
    - image: rehab.png
      alt: Una sessione di riabilitazione motoria
    - image: npc.png
      alt: Personaggi non giocanti in un videogioco
  summary: >-
    The architecture developed for dance is not limited to dance.
    Its underlying principles can be adapted to different bodies, tasks, and domains.
  body: |
    The principles developed for dance may extend to other settings where
    human movement matters: the gym, the rehabilitation studio, or the training field.

    Rather than modelling only how an ideal athlete should move, or how an average
    person moves, such a system could learn how an individual actually moves,
    their habits, asymmetries, and recurring patterns and adapt as new observations
    accumulate across sessions.

    The architecture developed for dance is therefore not inherently a dance architecture.
    It provides a framework for modelling movement across domains, with the generative
    constraints and objectives calibrated to each application.

- id: performances
  tag: Live
  title: Live performances
  side: left
  video: live_perf.mp4
  video_alt: Una danzatrice in scena accanto alla proiezione del suo scheletro digitale

  summary: >-
    Duetto's first public appearance, presented through two live performances
    tracing the transition from synchronised tracking to generative interaction.
  body: |
    Duetto made its first public appearance at the [IntelligentIA](https://intelligentia.live/) event through
    two live performances conceived as a progressive exploration of human–machine
    interaction.

    The first began in fully synchronised mode, with the digital skeleton mirroring
    the dancer in real time. A temporal delay was then gradually introduced,
    creating a visible misalignment between the physical and digital bodies.

    The second performance moved from synchrony into generative mode, allowing
    the digital skeleton to propose movements rather than simply follow the performer.

    Together, the two performances traced the project's central research trajectory:
    from imitation towards interaction. They served both as an artistic statement
    and as a public demonstration of the system's ability to transition between
    distinct modes of movement interaction.