- id: why-movement
  tag: Foundations
  title: Why movement
  image: grid_animation.webp
  image_alt: Uno scheletro tracciato in movimento su una griglia
  summary: >-
    The body is concrete enough to measure and open-ended enough to be
    genuinely creative — a demanding testbed for exploratory AI.
  body: |
    Building a system designed for genuine exploration means the choice of
    domain is not neutral. We chose the human body because it sits in a
    uniquely productive position: concrete enough to measure, open-ended
    enough to be genuinely creative.

    Human movement is the expression of a complex dynamical system — a
    high-dimensional trajectory through phase space, non-stationary,
    sensitive to initial conditions, continuously modulated by the feedback
    between internal state and external environment. As a time series it
    carries information across simultaneous timescales, from joint-level
    dynamics to gestural phrasing, and stays entangled with intention and
    context in ways that make it irreducible to pure biomechanics.
  blocks:
    - heading: A spectrum of semantic constraint
      body: |
        Unlike language, where a misplaced word breaks coherence, movement
        operates across a range of tolerances. Expressive domains such as
        dance afford vast combinatorial freedom: the syntax is permissive
        and novelty is not an error. Procedural domains — a surgeon
        operating, an athlete executing a technique — impose tight
        boundaries where deviation carries real cost.

        The same body, the same joints, the same physics, but an entirely
        different tolerance for variation. That spectrum is a feature: it
        means a movement model is not one fixed notion of correctness, but
        a framework that calibrates its generative logic to the semantic
        regime of the application.

- id: large-movement-model
  side: left
  tag: Model
  title: The Large Movement Model
  image: D1_M17_T1_Frontal_trajectory.svg
  image_alt: Uno scheletro tracciato in movimento su una griglia
  summary: >-
    Joints as vocabulary, movement sequences as sentences — a model that
    learns the grammar of how a body moves through space and time.
  body: |
    What made large language models possible was not scale alone, but the
    insight that language has a grammar: an underlying statistical structure
    that, learned deeply enough, allows a system to generate coherent and
    even creative output.

    Movement has a grammar too. A Large Movement Model is to the body what a
    language model is to language — joints serve as vocabulary, movement
    sequences as sentences, and the model learns the underlying rules of how
    a body moves through space and time.

- id: duetto
  tag: Application
  title: Duetto
  image: dance1.jpg
  image_alt: Una danzatrice in scena accanto alla proiezione del suo scheletro digitale
  credit: CCN/Aterballetto al Festival Aperto con Microdanze e Over Dance
  summary: >-
    A real-time generative system that follows a dancer's movement, learns
    from it, and proposes alternative trajectories in return.
  body: |
    Duetto is the first application and proof of concept of the Large
    Movement Model, built around two questions: how technology can enrich
    dancers' creative practices, and whether deep learning can power a
    movement suggestion system for dancers.

    The core challenge is a generative system capable of continuous,
    real-time, bidirectional interaction with a human performer — without
    the latency that would break creative flow. To the best of current
    knowledge this remains an open problem in the field. The human moves,
    the system listens, the system proposes, the human responds.
  blocks:
    - heading: Why dance
      body: |
        Dance was chosen not because it is the only application, but because
        it represents the upper bound of movement complexity: maximally
        free, expressive, and creative. If a system can hold a dialogue with
        a dancer, it can hold one with any body in any context.

- id: how-it-works
  tag: Method
  title: How it works
  layout: centered
  collapsible: true
  summary: >-
    From video to tokens to real-time generation — the pipeline behind the
    live dialogue.
  body: |
    The pipeline starts from video, from which we extract audio signals,
    high-dimensional motion capture, and multimodal input from the body in
    movement. From there the model learns to compress and structure that
    data into latent representations, then to generate new movement rather
    than memorise what it has seen.
  blocks:
    - heading: Data collection
      image: DSC00383.JPG
      image_alt: Uno scheletro tracciato in movimento su una griglia
      body: |
        In the first session we recruited dancers across three experience
        levels — professional, semi-professional, non-professional — and
        captured their movement across nine musical conditions varying in
        intensity, style, and tempo, to maximise diversity in the training
        distribution.

        In the second session, sixteen professional dancers each performed
        four improvised pieces under choreographic guidance. In two of the
        four trials they moved while viewing a skeletonised projection of
        their own body — a feedback condition that directly informed the
        design of the interactive system.

    - heading: Pose estimation
      video: D1_M9_T2_svision.mp4
      video_alt: How sVision tracks a moving body
      body: |
        Movement is captured with sVision, our real-time human pose
        estimation pipeline, which extracts key anatomical landmarks and
        represents the body as a set of spatial coordinates evolving over
        time.

    - heading: Quantising the body
      image: video_som.gif
      image_alt:  Quantising the body
      body: |
        Raw joint coordinates must be transformed into a discrete vocabulary
        a generative model can process. The choice of quantisation framework
        determines whether the resulting token space is interpretable and
        controllable, or simply a black box.

        VQ-VAE is the current state of the art and serves as our baseline.
        Building on it we developed SOM-VQ, which combines vector
        quantisation with Self-Organising Maps to give the codebook an
        explicit spatial structure: tokens that are close together represent
        similar postures. This turns the codebook into a navigable map of
        movement, and that structure is what makes real human-in-the-loop
        interaction possible — a dancer can steer the system by moving
        through the map, diverging from a reference, exploring nearby
        regions, or returning toward a target. Control is not an add-on; it
        grows out of how the space is organised.

    - heading: The generative model
      body: |
        Built on top of the quantised representation, the generative core is
        an autoregressive model that produces movement token by token,
        conditioning each output on both the history of past states and the
        live input from the performer.

        The critical requirement is real-time generation: the system must
        produce new movement at every step, not replay cached sequences, and
        fast enough to sustain unbroken interaction.

    - heading: Divergence as dialogue
      images:
        - image: som1.png
          alt: Superficie di attivazione della SOM con la zona di campionamento
          caption: SOM activation surface — brightness is proximity to the performer's pose.
        - image: som2.png
          alt: Probabilità di campionamento del transformer nella stessa zona
          caption: Next-token probabilities, restricted to the same zone.
      body: |
        The spatial gap between where the machine is and where the performer
        is, is not an error — it is the creative distance the system
        navigates. Proximity is enforced by the topology of the map rather
        than by rules, continuously re-anchoring generation toward the
        human.

- id: staying-open
  tag: Theory
  title: Staying open
  side: left
  image: recursion.jpeg
  image_alt:  Recursion
  summary: >-
    A system that learns only from you risks becoming a mirror. Dreaming
    Learning is what lets it specialise without closing in.
  body: |
    Generative models are remarkably good at compressing and reproducing the
    world, but every time they do they risk losing part of their diversity.
    Trained recursively on their own synthetic output, they progressively
    lose diversity and degrade — what is now called model collapse.

    We found the problem runs deeper than architecture or scale. When a
    model is trained on a finite set of examples through repeated
    resampling, collapse eventually becomes inevitable. We identified the
    iteration at which some of the original diversity disappears
    irreversibly, and call it the extinction threshold.
  blocks:
    - heading: Recursion as the cure
      body: |
        The problem is not recursion in itself — it is passive recursion.
        Dreaming Learning uses the model's own synthetic output during
        training, but to generate trajectories that maximise exploration
        while remaining anchored to the real distribution. Synthetic data
        becomes a controlled exploratory mechanism rather than a cheap
        substitute for real data.

        Alongside it, Lyapunov Learning at the Onset of Chaos trains models
        to operate between rigidity and noise — the regime where a system is
        both sensitive and structured.

    - heading: Why this matters for a dancer
      body: |
        A system that learns only from one person risks becoming a mirror:
        increasingly faithful, increasingly useless. This is model collapse
        at a personal scale — not the loss of diversity across a population,
        but the loss of the capacity to surprise. Dreaming Learning is the
        mechanism that lets the system know a body deeply and, from that
        knowledge, still offer a movement it has never tried.

- id: beyond-the-stage
  tag: Outlook
  title: Beyond the stage
  gallery:
    - image: sport.jpg
      alt: Un tennista a metà servizio
    - image: cuisine.jpg
      alt: Mani che emulsionano una salsa
    - image: rehab.jpg
      alt: Una sessione di riabilitazione motoria
    - image: npc.jpg
      alt: Personaggi non giocanti in un videogioco
  summary: >-
    The architecture built for dance is not a dance architecture — it works
    for any body, in any domain.
  body: |
    Everything built for the dancer applies to any body in motion: a gym, a
    rehabilitation studio, a training field. A system that observes not how
    an ideal athlete moves, nor how a statistical average moves, but how you
    move — your habits, your asymmetries, your recurring patterns — and
    keeps learning session after session.

    The architecture built for dance is not a dance architecture. It is an
    architecture for any body, in any domain, with any tolerance for
    variation: the same logic, calibrated differently.

- id: performances
  tag: Live
  title: Live performances
  side: left
  image: live_perf.gif
  image_alt: Una danzatrice in scena accanto alla proiezione del suo scheletro digitale

  summary: >-
    Duetto's first public appearance, staged as a progressive experiment in
    human-machine interaction.
  body: |
    Duetto made its first public appearance at the IntelligentIA event
    through two live performances designed as a progressive experiment.

    The first started in fully synchronous mode, the digital skeleton
    mirroring the dancer in real time, before a temporal delay was gradually
    introduced and a visible misalignment opened between the two bodies. The
    second shifted from synchrony into full generative mode, where the
    skeleton began to propose movement rather than follow it.

    Together they mapped the project's research trajectory — from imitation
    to interaction — functioning at once as artistic statement and as
    experimental demonstration of the system's capacity to move between
    operational modes.
