As part of theGATE Festival 2026, Duetto will be presented as an exploration
of the relationship between artificial intelligence and human movement. The
project resonates strongly with the context of theGATE, a festival dedicated
to the convergence of science, technology, arts and society, and to the new
forms of cultural experimentation emerging at their intersections.

Duetto will be accompanied by an interactive installation inviting the public
to engage directly with a dancing AI. Visitors will not only observe the
project, but enter a live encounter with it, experiencing movement as a space
of exchange between human presence and machine interpretation.

By bringing together artistic research, scientific inquiry and technological
experimentation, Duetto offers an example of how collaborations across
disciplines can generate new questions, new forms, and new ways of imagining
the relationship between humans and intelligent systems — approaching the body
not as something to be reduced to data, but as a living source of knowledge,
creativity and transformation.
  
