Duetto made its first public appearance through two live performances designed
as a progressive experiment.

The first started in fully synchronous mode, the digital skeleton mirroring the
dancer in real time, before a temporal delay was gradually introduced and a
visible misalignment opened between the two bodies. The second shifted from
synchrony into full generative mode, where the skeleton began to propose
movement rather than follow it.

Together they mapped the project's research trajectory — from imitation to
interaction — functioning at once as artistic statement and as experimental
demonstration of the system's capacity to move between operational modes.