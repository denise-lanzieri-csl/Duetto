# ============================================================
# PIPELINE — the stages shown on the /pipeline/ page.
#
# Built for projection: few words, large type, one glance.
# Clicking a card opens a panel with the photograph and the
# text; "click to read more" inside it goes to the research page.
#
# `icon`   line drawing in assets/pipeline/, shown on the card
# `image`  photograph in assets/pipeline/, shown in the panel
# `url`    the anchor on the research page
# ============================================================

- step: Data collection
  title: Customized workshop
  blurb: Dancers improvising across musical conditions, with choreographic guidance.
  icon: icon-data.svg
  image: step-data.jpg
  url: /research/#data-collection

- step: Pose estimation
  title: Movements captured through skeletonization
  blurb: sVision turns video into anatomical landmarks moving through space.
  icon: icon-pose.svg
  image: step-pose.png
  url: /research/#pose-estimation

- step: Encoding
  title: Posture quantization
  blurb: Postures become a vocabulary, a navigable map rather than a black box.
  icon: icon-quantise.svg
  video: step-som.mp4
  url: /research/#quantising-the-body

- step: Generation
  title:  Autoregressive Model
  blurb: Movements produced token by token, in real time, conditioned on machine history and live performer input
  icon: icon-generate.svg
  video: step-gen.mp4
  url: /research/#generative-model

- step: Smart Mirror
  title: Human in the loop
  blurb: Human action continuously shapes what the system understands and proposes, turning divergence into a form of dialogue.
  icon: icon-dialogue.svg
  video: step-dialogue.mp4
  url: /research/#smart-mirror

- step: Stage
  title: Live performance
  blurb: From mirroring to full generation, in front of an audience.
  icon: icon-stage.svg
  video: step-stage.mp4
  url: /events/
