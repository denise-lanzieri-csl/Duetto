# ============================================================
# PIPELINE — the stages shown on the /pipeline/ page.
#
# Built for projection: few words, large type, one glance.
# Clicking a card opens a panel with the photograph and the
# text; "click to read more" inside it goes to the research page.
#
# `icon`   line drawing in assets/pipeline/, shown on the card
# `image`  photograph in assets/pipeline/, shown in the panel
# `url`    the anchor on the research page
# ============================================================

- step: Data collection
  title: Movement workshops
  blurb: Dancers improvise under different musical conditions, guided by choreographic tasks.
  icon: icon-data.svg
  image: step-data.jpg
  url: /research/#data-collection

- step: Pose estimation
  title: From video to movement
  blurb: Real-time pose estimation tracks key body landmarks, turning video into a sequence of spatial coordinates.
  icon: icon-pose.svg
  image: step-pose.png
  url: /research/#pose-estimation

- step: Encoding
  title: A vocabulary of postures
  blurb: The body is represented through a learned vocabulary of postures, organised into a map of similar configurations.
  icon: icon-quantise.svg
  video: step-som.mp4
  url: /research/#quantising-the-body

- step: Generation
  title:  Autoregressive Model
  blurb: The model generates movement one token at a time, drawing on its learned patterns and the performer's live input.
  icon: icon-generate.svg
  video: step-gen.mp4
  url: /research/#generative-model

- step: Smart Mirror
  title: A dialogue with the performer
  blurb: The performer's movements shape the system's responses, creating an ongoing exchange between human action and generated movement.
  icon: icon-dialogue.svg
  video: step-dialogue.mp4
  url: /research/#smart-mirror

- step: Stage
  title: Live performance
  blurb: From mirroring movement to generating new possibilities, Duetto brings human–AI interaction onto the stage.
  icon: icon-stage.svg
  video: step-stage.mp4
  url: /events/
